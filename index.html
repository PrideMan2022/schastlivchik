<body>
<header><div class="wrap hd">
  <img class="logo" src="assets/logo.svg?v=3" alt="Счастливчик" width="40" height="40">
  <div class="brand"><b>Счастливчик</b><span>число решает всё</span></div>
  <button class="mark" id="hdava" onclick="editProfile()" title="Профиль">🍀</button>
  <div class="purse">
    <div class="v"><b class="num" id="coins">0</b><span>монет</span></div>
    <button class="add" onclick="go('shop')" title="Купить монеты">+</button>
  </div>
</div></header>

<div class="appbg" aria-hidden="true"></div>
<main class="wrap" id="app"></main>

<nav><div class="nv">
  <button data-t="lobby" onclick="go('lobby')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>Столы</button>
  <button data-t="shop" onclick="go('shop')">
    <svg viewBox="0 0 24 24"><path d="M3 6h18l-1.5 12H4.5z"/><path d="M8 6V4h8v2"/></svg>Монеты</button>
  <button data-t="me" onclick="go('me')">
    <svg viewBox="0 0 24 24"><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/><circle cx="12" cy="8" r="4"/></svg>Профиль</button>
  <button data-t="rules" onclick="go('rules')">
    <svg viewBox="0 0 24 24"><path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z"/></svg>Правила</button>
</div></nav>
<div id="toasts"></div>
<div id="layer"></div>

<script src="core.js?v=36"></script>
<script>
'use strict';
/* Держим высоту приложения равной реально видимой области.
   iOS-браузеры прячут и показывают панели, меняя visualViewport. */
function fitViewport(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
fitViewport();
addEventListener('resize', fitViewport);
addEventListener('orientationchange', () => setTimeout(fitViewport, 260));
if (window.visualViewport){
  visualViewport.addEventListener('resize', fitViewport);
  visualViewport.addEventListener('scroll', fitViewport);
}
const U = () => Core.user, CC = () => Core.core;
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const rnd = Core.rnd;
const money = n => Math.round(n).toLocaleString('ru-RU');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt = t => new Date(t).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
function plural(n,a,b,c){const m=Math.abs(n)%100,d=m%10;if(m>10&&m<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
function toast(text, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || ''); el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity=0; }, 2400);
  setTimeout(()=> el.remove(), 2750);
}
let actx = null;
function beep(f, d, type, v){
  if (!U().sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || .04, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (d || .12));
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (d || .12));
  }catch(e){}
}
const sfx = {
  tick: () => beep(1200, .04, 'square', .02),
  pick: () => beep(560, .06, 'triangle', .04),
  roll: () => beep(320, .04, 'sawtooth', .015),
  win:  () => [523,659,784,1047].forEach((f,i)=> setTimeout(()=>beep(f,.2,'triangle',.06), i*95)),
  lose: () => beep(150, .22, 'sine', .04)
};
function paintCoins(){ $('#coins').textContent = money(U().coins); }

/* ---------- столы и боты ---------- */
const STAKES = [10, 50, 100, 500, 1000], SIZES = [5, 10];
const TNAMES = ['Партер','Ложа','Терраса','Бельэтаж','Галерея','Кабинет','Ротонда','Мезонин','Атриум','Купол'];
const TABLES = [];
STAKES.forEach((st, i) => SIZES.forEach((sz, j) =>
  TABLES.push({ id:'t'+st+'_'+sz, stake:st, size:sz, name:TNAMES[(i*2+j)%TNAMES.length] })));

/* цвета жетонов по номиналу — как фишки в клубе: младшие холодные, старшие тёплые */
const CHIP = {
  10:   { a:'#4f8cff', b:'#2a5bd7', tint:'rgba(79,140,255,.28)' },
  50:   { a:'#34d399', b:'#0f9b6c', tint:'rgba(52,211,153,.26)' },
  100:  { a:'#ff5fa2', b:'#c62b6d', tint:'rgba(255,95,162,.26)' },
  500:  { a:'#a78bfa', b:'#6c5ce7', tint:'rgba(108,92,231,.32)' },
  1000: { a:'#ffc24b', b:'#ff7a18', tint:'rgba(255,194,75,.3)'  }
};
/* цвет аватара — из имени, чтобы соперники узнавались в лицо */
const AVC = ['#6c5ce7','#22d3ee','#ff5fa2','#34d399','#ffc24b','#ff7a18','#4f8cff','#a78bfa'];
function avatarColor(name){
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const c = AVC[h % AVC.length];
  return 'linear-gradient(140deg,' + c + ',' + c + '99)';
}
const NAMES = ['Аркадий','Вера','Тимур','Лидия','Осип','Марта','Глеб','Ника','Савва','Рита','Кузьма','Ада','Феликс',
  'Инга','Эрик','Злата','Тихон','Юна','Борис','Клара','Демид','Стефа','Ян','Ольга','Роман','Дина','Пётр','Милана',
  'Игнат','Соня','Артур','Тамара','Лев','Агата','Марк','Ксения'];
function makeBot(){
  const nick = NAMES[rnd(0, NAMES.length - 1)];
  return { bot:true, nick, mono:Core.ICONS[rnd(0, Core.ICONS.length - 1)], lucky:rnd(1,50),
           speed:rnd(3,26), lazy:Core.rand() < .08,
           pick:null, ready:false, readyAt:0, place:0, won:0 };
}

/* ---------- игровой цикл ---------- */
const ROUND_SEC = 30, ROLL_MS = 2400, RESULT_MS = 4600;
let G = null, loopId = null, screen = 'lobby', filterStake = 'all', pickerPhase = null, lastSec = -1;

function sitDown(id){
  const t = TABLES.find(x => x.id === id); if (!t) return;
  if (U().blocked){ toast('Аккаунт заблокирован: ' + (U().blockReason || 'обратитесь в поддержку'), 'bad'); return; }
  if (U().coins < t.stake){ toast('Не хватает монет для этого стола', 'bad'); go('shop'); return; }
  G = { table:t, round:0, seats:[], phase:'betting', t0:0, roll:0, pot:0, fee:0, me:null, winners:[], cancelled:false };
  newRound(true); go('table');
}
function exitTable(){
  if (G && G.me && G.me.ready && G.phase === 'betting'){
    U().coins += G.table.stake; Core.saveUser();
    toast('Ставка возвращена: ' + money(G.table.stake) + ' монет');
  }
  stopLoop(); G = null; Core.saveUser(); paintCoins(); closeLayer();
}
function leaveTable(){ exitTable(); go('lobby'); }
function newRound(first){
  const t = G.table;
  G.round++; G.phase = 'betting'; G.t0 = Date.now(); G.roll = 0;
  G.winners = []; G.cancelled = false; pickerPhase = null;
  const keep = first ? [] : G.seats.filter(s => s.bot && Core.rand() < .65);
  keep.forEach(b => { b.pick=null; b.ready=false; b.readyAt=0; b.place=0; b.won=0; b.speed=rnd(3,26); b.lazy=Core.rand()<.08; });
  const me = { bot:false, nick:'Вы', mono:'В', pick:null, ready:false, readyAt:0, place:0, won:0 };
  G.me = me;
  const seats = [me].concat(keep);
  while (seats.length < t.size) seats.push(makeBot());
  const used = {};
  seats.forEach(s => { let n = s.nick, k = 2; while (used[n]) n = s.nick + ' ' + (k++); used[n] = 1; s.nick = n; });
  G.seats = seats.slice(0, t.size);
  renderTable(); startLoop();
}
function startLoop(){ if (!loopId) loopId = setInterval(tick, 180); }
function stopLoop(){ clearInterval(loopId); loopId = null; }

function tick(){
  if (!G || screen !== 'table') return;
  const el = Date.now() - G.t0;
  if (G.phase === 'betting'){
    const left = Math.max(0, ROUND_SEC - Math.floor(el / 1000));
    G.seats.forEach(s => {
      if (!s.bot || s.ready) return;
      const sec = el / 1000;
      if (!s.pick && sec > s.speed * .4) s.pick = freeNumber(s.lucky);
      if (!s.lazy && sec >= s.speed && s.pick){ s.ready = true; s.readyAt = Date.now(); }
    });
    if (left !== lastSec){ lastSec = left; if (left <= 5 && left > 0) sfx.tick(); }
    const allReady = G.seats.every(s => s.ready || (s.bot && s.lazy));
    if (left <= 0 || (allReady && el > 2500)) startRoll(); else paintDyn();
  } else if (G.phase === 'rolling'){
    if (el < ROLL_MS){
      const b = $('#drawnum');
      if (b){ b.textContent = rnd(1, 50); if (Math.random() < .35) sfx.roll(); }
    } else finishRound();
  } else if (G.phase === 'results'){
    if (el > RESULT_MS && !$('#resultbox')) newRound(false);
  }
}
function freeNumber(pref){
  const taken = new Set(G.seats.filter(s => s.pick).map(s => s.pick));
  if (pref && !taken.has(pref) && Core.rand() < .5) return pref;
  let n, g = 0; do { n = rnd(1, 50); } while (taken.has(n) && ++g < 200);
  return n;
}
function pickNum(n, random){
  if (!G || G.phase !== 'betting' || G.me.ready) return;
  if (random) n = freeNumber(null);
  if (G.seats.some(s => s !== G.me && s.pick === n)) return;
  G.me.pick = n; sfx.pick(); paintDyn();
}
function ready(){
  if (!G || G.phase !== 'betting' || G.me.ready) return;
  if (!G.me.pick){ toast('Сначала выберите число', 'bad'); return; }
  if (U().coins < G.table.stake){ toast('Не хватает монет', 'bad'); go('shop'); return; }
  U().coins -= G.table.stake; G.me.ready = true; G.me.readyAt = Date.now();
  Core.saveUser(); paintCoins(); beep(700, .1, 'triangle', .05); paintDyn();
}
function startRoll(){
  const players = G.seats.filter(s => s.ready && s.pick);
  if (players.length < 2){
    G.cancelled = true; G.phase = 'results'; G.t0 = Date.now();
    if (G.me.ready){ U().coins += G.table.stake; G.me.ready = false; Core.saveUser(); paintCoins(); }
    toast('Мало игроков — раунд отменён, ставки возвращены');
    renderTable(); return;
  }
  G.phase = 'rolling'; G.t0 = Date.now(); G.roll = rnd(1, 50);
  G.pot = players.length * G.table.stake;
  renderTable();
}
function finishRound(){
  const t = G.table, players = G.seats.filter(s => s.ready && s.pick);
  const res = Core.payout(players, G.roll, t.stake);
  G.pot = res.pot; G.fee = res.fee; G.winners = res.list.slice(0, 3);
  Core.registerFee(res.fee);
  const u = U();
  u.freq[G.roll]++;
  res.list.forEach(p => { if (p.bot) u.botProfit[p.nick] = (u.botProfit[p.nick] || 0) + (p.won - t.stake); });
  const me = G.me;
  if (me.ready){
    const delta = me.won - t.stake;
    u.coins += me.won; u.played++; u.betSum += t.stake; u.winSum += me.won;
    if (me.place){ u.wins++; u.streak++; if (u.streak > u.bestStreak) u.bestStreak = u.streak; } else u.streak = 0;
    if (me.place === 1) u.top1++;
    if (delta > u.best) u.best = delta;
    u.hist.unshift({ id: Core.uid('r'), roll:G.roll, pick:me.pick, place:me.place, delta:delta,
                     stake:t.stake, pot:res.pot, players:res.list.length, table:t.name, t:Date.now() });
    if (u.hist.length > 80) u.hist.length = 80;
    const lvl = Core.addXp(me.place ? 30 : 12);
    Core.questProgress({ place: me.place, stake: t.stake, won: me.won });
    if (lvl.levels){
      setTimeout(() => toast('Уровень ' + lvl.level + '! +' + money(lvl.coins) + ' монет', 'good'), 900);
      setTimeout(() => confetti(24), 900);
    }
    me.place ? sfx.win() : sfx.lose();
  }
  G.phase = 'results'; G.t0 = Date.now();
  Core.saveUser(); paintCoins(); renderTable();
  if (me.ready) showResult(me);
}
function showResult(me){
  const delta = me.won - G.table.stake, rk = { 1:'🥇', 2:'🥈', 3:'🥉' };
  if (me.place) confetti(me.place === 1 ? 70 : 30);
  $('#layer').innerHTML = `
  <div class="modal" id="resultbox" onclick="closeLayer()">
    <div class="mbox" onclick="event.stopPropagation()">
      <div style="font-size:44px;line-height:1">${me.place ? rk[me.place] : '🎲'}</div>
      <h3>${me.place === 1 ? 'Главный победитель!' : me.place ? 'Вы в призах' : 'В этот раз мимо'}</h3>
      <div class="tiny muted">выпало <b class="gold">${G.roll}</b> · ваше ${me.pick} · разница ${Math.abs(me.pick - G.roll)}</div>
      <div class="verdict ${delta > 0 ? 'win' : 'muted'}">${delta > 0 ? '+' : ''}${money(delta)}</div>
      <div class="eyebrow">распределение банка ${money(G.pot)}</div>
      <div class="podium">
        ${G.winners.map((p, i) => `<div class="pl p${i+1}">
          <span class="rk">${rk[i+1]}</span>
          <div class="main"><b>${esc(p.nick)}</b><div class="tiny muted">число ${p.pick} · разница ${Math.abs(p.pick - G.roll)}</div></div>
          <span class="amt">+${money(p.won)}</span></div>`).join('')}
        <div class="pl"><span class="rk">🏛</span><div class="main"><b>Комиссия стола</b>
          <div class="tiny muted">5% банка, из них 10% в копилку добра</div></div>
          <span class="amt muted">${money(G.fee)}</span></div>
      </div>
      <div class="acts">
        <button class="btn gold grow" onclick="closeLayer()">Играть дальше</button>
        <button class="btn ghost" onclick="closeLayer();leaveTable()">Выйти</button>
      </div>
      <button class="btn ghost full sm" style="margin-top:10px" onclick="closeLayer();complainRound('${U().hist[0] ? U().hist[0].id : ''}')">Пожаловаться на раунд</button>
    </div>
  </div>`;
}
function closeLayer(){ $('#layer').innerHTML = ''; if (G && G.phase === 'results') G.t0 = 0; }
/* Салют при выигрыше: лёгкий, самоочищающийся, без библиотек. */
function confetti(count){
  const box = document.createElement('div'); box.className = 'spark';
  const colors = ['#ffc24b','#ff5fa2','#22d3ee','#6c5ce7','#34d399'];
  let html = '';
  for (let i = 0; i < count; i++){
    html += `<i style="left:${rnd(0,100)}%;top:${rnd(-30,-5)}vh;background:${colors[rnd(0,colors.length-1)]};
      animation-duration:${(1.6 + Math.random()*1.6).toFixed(2)}s;animation-delay:${(Math.random()*.5).toFixed(2)}s"></i>`;
  }
  box.innerHTML = html; document.body.appendChild(box);
  setTimeout(()=> box.remove(), 4200);
}

/* ============================================================
   ЭКРАНЫ
   ============================================================ */
function go(name){
  if (screen === 'table' && name !== 'table' && G) exitTable();
  screen = name;
  $$('.nv button').forEach(b => b.classList.toggle('on', b.dataset.t === name));
  ({ lobby:renderLobby, shop:renderShop, me:renderMe, rules:renderRules, table:renderTable }[name] || renderLobby)();
  window.scrollTo(0, 0);
}

/* --- лобби --- */
function renderLobby(){
  stopLoop();
  const list = TABLES.filter(t => filterStake === 'all' || t.stake === filterStake);
  $('#app').innerHTML = `
   <div class="screen">
    <div class="head">
    <div class="h1">Игровые столы</div>
    <div class="sub">Ставка на всех за столом одинаковая. Раунд — тридцать секунд, три победителя.</div>
    <div class="filters">
      <button class="${filterStake==='all'?'on':''}" onclick="setFilter('all')">Все</button>
      ${STAKES.map(s => `<button class="${filterStake===s?'on':''}" onclick="setFilter(${s})">${s}</button>`).join('')}
    </div></div>
    <div class="scroll">
    ${rewardsStrip()}
    <div class="tables">
      ${list.map(t => {
        const busy = rnd(Math.min(2, t.size - 1), t.size - 1);
        const poor = U().coins < t.stake;
        const c = CHIP[t.stake];
        return `<button class="tbl" onclick="sitDown('${t.id}')" style="--tint:${c.tint}">
          <div class="top">
            <div class="chip" style="background:linear-gradient(145deg,${c.a},${c.b})">${t.stake}</div>
            <div><div class="nm">«${t.name}»</div>
              <div class="sz">${t.size} ${plural(t.size,'место','места','мест')}</div></div>
          </div>
          <div class="occ">${Array.from({length:t.size},(_,i)=>`<i class="${i<busy?'f':''}"></i>`).join('')}</div>
          <div class="meta"><span>${busy}/${t.size} за столом</span><span>банк <b>${money(t.stake*t.size)}</b></span></div>
          ${poor ? `<div class="lock">Нужно ${money(t.stake)} монет</div>` : ''}</button>`;
      }).join('')}
    </div>
    <div class="panel acc" style="margin:14px 0 4px;padding:14px 18px">
      <div class="row between center">
        <div><div class="eyebrow">копилка добра</div>
          <div class="tiny muted" style="margin-top:3px">10% прибыли заведения — в детский дом</div></div>
        <div class="gold num" style="font-size:23px;font-weight:800">${money(CC().charity)} ₽</div>
      </div>
    </div>
    </div>
   </div>`;
}
function setFilter(v){ filterStake = v; renderLobby(); }

/* Полоса удержания: уровень, ежедневная награда, задания дня. */
function rewardsStrip(){
  const u = U(), st = Core.dailyState(), qs = Core.questsToday();
  const need = Core.levelNeed(u.level), pct = Math.round(u.xp / need * 100);
  const readyQuests = qs.filter(q => q.done && !q.claimed).length;
  return `
    <div class="strip">
      <button class="lvl" onclick="go('me');meTab='stats';renderMe()">
        <div class="row between center"><b>Уровень ${u.level}</b>
          <span class="tiny muted num">${u.xp} / ${need} опыта</span></div>
        <div class="xpbar"><i style="width:${pct}%"></i></div>
      </button>
      <button class="daily ${st.canClaim?'ready':''}" onclick="openDaily()">
        <div class="ic">🎁</div>
        <div><b>${st.canClaim ? 'Награда за вход' : 'Забрано сегодня'}</b>
          <div class="tiny muted">${st.canClaim ? '+' + money(st.reward) + ' монет · день ' + st.day
            : 'цепочка ' + st.streak + ' ' + plural(st.streak,'день','дня','дней')}</div></div>
        ${st.canClaim ? '<span class="pip"></span>' : ''}
      </button>
      <button class="daily ${readyQuests?'ready':''}" onclick="openQuests()">
        <div class="ic">🎯</div>
        <div><b>Задания дня</b>
          <div class="tiny muted">${readyQuests ? 'готово к получению: ' + readyQuests
            : qs.filter(q=>q.claimed).length + ' из ' + qs.length + ' выполнено'}</div></div>
        ${readyQuests ? '<span class="pip"></span>' : ''}
      </button>
    </div>`;
}
function openDaily(){
  const st = Core.dailyState();
  $('#layer').innerHTML = `
  <div class="modal" onclick="closeLayer()"><div class="mbox" onclick="event.stopPropagation()">
    <div style="font-size:42px;line-height:1;text-align:center">🎁</div>
    <h3 style="text-align:center">Награда за вход</h3>
    <div class="tiny muted" style="text-align:center">Заходите каждый день — награда растёт.
      Пропустили день — цепочка начинается заново.</div>
    <div class="week">
      ${st.table.map((v, i) => {

function paintDyn(force){
  if (!G || screen !== 'table') return;
  const dyn = $('#dyn'); if (!dyn) return;
  const t = G.table, el = Date.now() - G.t0;
  const inGame = G.seats.filter(s => s.ready).length;

  if (G.phase === 'betting'){
    const leftMs = Math.max(0, ROUND_SEC * 1000 - el), left = Math.ceil(leftMs / 1000);
    const frac = leftMs / (ROUND_SEC * 1000), C0 = 2 * Math.PI * 42;
    if (!$('#dial') || force){
      dyn.innerHTML = `
        <div class="dial ${left<=5?'warn':''}" id="dial">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b7bff"/></linearGradient></defs>
            <circle class="bgc" cx="50" cy="50" r="42"/>
            <circle class="fgc" cx="50" cy="50" r="42" stroke-dasharray="${C0}" stroke-dashoffset="0" id="arc"/></svg>
          <b class="num" id="dialnum">${left}</b><span>секунд</span></div>
        <div class="bank"><div class="lb">банк раунда</div>
          <b class="num gold" id="banknum">${money(inGame * t.stake)}</b>
          <div class="sm" id="banksub">${inGame} ${plural(inGame,'ставка','ставки','ставок')} по ${t.stake}</div></div>`;
    } else {
      $('#dialnum').textContent = left;
      $('#arc').setAttribute('stroke-dashoffset', String(C0 * (1 - frac)));
      $('#dial').classList.toggle('warn', left <= 5);
      $('#banknum').textContent = money(inGame * t.stake);
      $('#banksub').textContent = inGame + ' ' + plural(inGame,'ставка','ставки','ставок') + ' по ' + t.stake;
    }
    $('#phaselab').textContent = 'приём ставок';
  } else if (G.phase === 'rolling'){
    if (!$('#drawnum')) dyn.innerHTML = `
      <div class="drawn spin"><b class="num" id="drawnum">0</b></div>
      <div class="bank"><div class="lb">разыгрывается банк</div><b class="num gold">${money(G.pot)}</b>
        <div class="sm">комиссия стола 5%</div></div>`;
    $('#phaselab').textContent = 'розыгрыш';
  } else {
    dyn.innerHTML = G.cancelled
      ? `<div class="drawn void"><b>отмена</b></div>
         <div class="bank"><div class="lb">мало игроков</div><b class="num muted">—</b><div class="sm">ставки возвращены</div></div>`
      : `<div class="drawn hit"><b class="num">${G.roll}</b></div>
         <div class="bank"><div class="lb">банк раунда</div><b class="num gold">${money(G.pot)}</b>
           <div class="sm">комиссия ${money(G.fee)} · выплачено ${money(G.pot - G.fee)}</div></div>`;
    $('#phaselab').textContent = 'итоги';
  }
  paintSeats(); paintActs();
  if (pickerPhase !== G.phase){ pickerPhase = G.phase; buildPicker(); }
  syncPicker();
}
function paintSeats(){
  const box = $('#seats'); if (!box) return;
  const rk = { 1:'I', 2:'II', 3:'III' };
  box.innerHTML = G.seats.map(s => {
    const c = [];
    if (!s.bot) c.push('me');
    if (s.ready && G.phase === 'betting') c.push('set');
    if (G.phase === 'results' && !G.cancelled){ if (s.place) c.push('w' + s.place); else c.push('out'); }
    else if (!s.ready && G.phase === 'rolling') c.push('out');
    const val = G.phase === 'betting'
      ? (s.ready ? (s.bot ? '<span class="pk q">✓</span>' : `<span class="pk num">${s.pick}</span>`) : '<span class="pk q">—</span>')
      : (s.ready ? `<span class="pk num">${s.pick}</span>` : '<span class="pk q">—</span>');
    const st = G.phase === 'betting'
      ? (s.ready ? 'готов ✓' : (s.pick ? 'выбирает' : 'думает'))
      : (!s.ready ? 'не участвует' : (s.place ? rk[s.place] + ' · +' + money(s.won) : 'без приза'));
    return `<div class="seat ${c.join(' ')}">
      ${s.place === 1 ? '<span class="crown">👑</span>' : ''}
      ${s.bot ? `<div class="av" style="background:${avatarColor(s.nick)}">${esc(s.mono)}</div>`
               : avatarHTML(U().avatar, 34)}
      <div class="who"><div class="nick">${esc(s.nick)}</div><div class="stt">${st}</div></div>${val}</div>`;
  }).join('');
}
function buildPicker(){
  const p = $('#picker');
  if (G.phase !== 'betting'){ p.innerHTML = ''; return; }
  p.innerHTML = `
    <div class="picker">
      <div class="pickhead"><div class="eyebrow">ваше число</div>
        <div class="tiny muted">занятые числа недоступны</div></div>
      <div class="g50">${Array.from({length:50},(_,i)=>`<button data-n="${i+1}" onclick="pickNum(${i+1})">${i+1}</button>`).join('')}</div>
    </div>`;
}
function syncPicker(){
  if (G.phase !== 'betting') return;
  const taken = new Set(G.seats.filter(s => s !== G.me && s.pick).map(s => s.pick));
  $$('#picker .g50 button').forEach(b => {
    const n = +b.dataset.n;
    b.classList.toggle('taken', taken.has(n) || G.me.ready);
    b.classList.toggle('sel', G.me.pick === n);
  });
}
function paintActs(){
  const a = $('#acts'); if (!a) return;
  if (G.phase === 'betting'){
    a.innerHTML = `<div class="acts">
        <button class="btn ${G.me.ready ? 'done' : 'gold'} grow" onclick="ready()" ${G.me.ready || !G.me.pick ? 'disabled' : ''}>
          ${G.me.ready ? '✓ Ставка принята' : 'Готов · ' + G.table.stake + ' монет'}</button>

      <div class="hintline">Кто не нажал «Готов» за 30 секунд — в раунде не участвует</div>`;
  } else if (G.phase === 'rolling'){
    a.innerHTML = `<div class="acts"><button class="btn grow" disabled>Крутим барабан…</button></div>`;
  } else {
    a.innerHTML = `<div class="acts">

}

/* Выгрузка данных — файл сохраняется прямо из браузера, ничего никуда не отправляется. */
function downloadData(){
  const blob = new Blob([JSON.stringify(Core.exportData(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'schastlivchik-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Файл с вашими данными сохранён', 'good');
}

  return `<div class="av ${cls||''}" style="${style};background:linear-gradient(140deg,${bg},${bg}99);

function rescue(){
  if (U().coins >= 10 || U().blocked) return;
  U().coins += 100; Core.saveUser(); paintCoins();
  toast('Спасательный круг: +100 монет');
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopLoop(); else if (G && screen === 'table') startLoop(); });
window.addEventListener('beforeunload', () => Core.flush());
setInterval(rescue, 5000);
/* PWA: после первого открытия игра ставится на экран «Домой» и работает без сети.
   На file:// сервис-воркеры недоступны — там просто пропускаем. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
/* Подсказка про установку — один раз, после регистрации. */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (U().registered && !U().installHinted){ U().installHinted = true; Core.saveUser(); showInstall(); }
});
function showInstall(){
  const el = document.createElement('div');
  el.className = 'toast good'; el.style.pointerEvents = 'auto';
  el.innerHTML = 'Поставить игру на экран телефона? &nbsp;';
  const b = document.createElement('b'); b.textContent = 'Установить'; b.style.cursor = 'pointer';
  b.onclick = () => { el.remove(); if (installEvt){ installEvt.prompt(); installEvt = null; } };
  el.appendChild(b); $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 12000);
}

paintCoins(); paintMe(); go('lobby');
if (!U().registered) welcome();
</script>
</body>
</html>
