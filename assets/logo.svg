<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Счастливчик">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#6c5ce7"/><stop offset="1" stop-color="#3b2f9e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7c0"/><stop offset=".6" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/><stop offset=".5" stop-color="#ffc24b"/><stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".62">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity=".5"/><stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- фишка -->
  <circle cx="128" cy="128" r="120" fill="url(#chip)"/>
  <circle cx="128" cy="128" r="120" fill="url(#glow)"/>

  <!-- насечки по краю -->
  <g fill="url(#ring)">
    <g id="notch"><rect x="119" y="4" width="18" height="30" rx="7"/></g>
    <use href="#notch" transform="rotate(45 128 128)"/>
    <use href="#notch" transform="rotate(90 128 128)"/>
    <use href="#notch" transform="rotate(135 128 128)"/>
    <use href="#notch" transform="rotate(180 128 128)"/>
    <use href="#notch" transform="rotate(225 128 128)"/>
    <use href="#notch" transform="rotate(270 128 128)"/>
    <use href="#notch" transform="rotate(315 128 128)"/>
  </g>

  <circle cx="128" cy="128" r="101" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="128" cy="128" r="90" fill="#121736"/>
  <circle cx="128" cy="128" r="90" fill="url(#glow)" opacity=".55"/>

  <!-- клевер: четыре доли по диагоналям, строго симметрично -->
  <g filter="url(#soft)" opacity=".5" fill="url(#leaf)">
    <circle cx="98" cy="98" r="34"/><circle cx="158" cy="98" r="34"/>
    <circle cx="98" cy="158" r="34"/><circle cx="158" cy="158" r="34"/>
  </g>
  <g fill="url(#leaf)">
    <circle cx="98" cy="98" r="33"/><circle cx="158" cy="98" r="33"/>
    <circle cx="98" cy="158" r="33"/><circle cx="158" cy="158" r="33"/>
  </g>
  <!-- верхний блик, чтобы фишка читалась объёмной -->
  <path d="M58 92a80 80 0 0 1 140 0" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="6" stroke-linecap="round"/>

  <!-- сердцевина-фишка -->
  <circle cx="128" cy="128" r="24" fill="#0f1330"/>
  <circle cx="128" cy="128" r="17" fill="url(#ring)"/>
  <circle cx="128" cy="128" r="8" fill="#0f1330" opacity=".85"/>
</svg>
